spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/reservacanchas
    username: reservacanchas
    password: reservacanchas
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: validate
  flyway:
    clean-disabled: true

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:4200}

jwt:
  secret: ${JWT_SECRET:}
  expiration: ${JWT_EXPIRATION:86400000}

dev:
  data:
    admin-sede-password: ${DEV_ADMIN_SEDE_PASSWORD:}
    admin-general-password: ${DEV_ADMIN_GENERAL_PASSWORD:}

logging:
  level:
    com.reservacanchas: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
